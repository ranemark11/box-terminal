name: 이벤트 일정 갱신

on:
  schedule:
    - cron: "17 19 * * *"   # 매일 04:17 (한국 시간)
  workflow_dispatch:        # GitHub 화면에서 직접 실행 버튼
  push:
    branches: [main]
    paths: ["scripts/update-events.mjs"]

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 일정 받아오기 + 번역
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-events.mjs
      - name: 바뀐 내용이 있으면 저장
        run: |
          git config user.name "box-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/events.json site/data/translations.json site/data/events-report.json
          [ -f site/data/rocket.json ] && git add site/data/rocket.json
          git diff --cached --quiet && exit 0
          git commit -m "일정 데이터 갱신 $(date -u +%F)"
          git pull --rebase origin main
          git push
