name: 포켓몬 도감 갱신

on:
  schedule:
    - cron: "47 19 * * *"   # 매일 04:47 (한국 시간). 바뀐 게 없으면 커밋하지 않음
  push:
    branches: [main]
    paths: ["scripts/build-pokedex.mjs", "scripts/dynamax.json"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 도감·티어 빌드
        run: node scripts/build-pokedex.mjs
      - name: 바뀐 내용이 있으면 저장
        run: |
          git config user.name "box-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data scripts/state
          git diff --cached --quiet && exit 0
          git commit -m "도감 데이터 갱신 $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: 바뀐 기술·포켓몬이 있으면 알림(이슈)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/pyo-changes.md"
          [ -f "$f" ] || exit 0
          gh issue create --repo "$GITHUB_REPOSITORY" --title "게임 데이터 변경 $(TZ=Asia/Seoul date +%F)" --body-file "$f" --assignee ranemark11 \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "게임 데이터 변경 $(TZ=Asia/Seoul date +%F)" --body-file "$f"
