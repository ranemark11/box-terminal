<style>
:root{
  --bezel:#2b3140; --bezel-hi:#3c4458; --bezel-lo:#1a1e28;
  --screen:#0b2124; --grid:rgba(120,255,210,.06);
  --ink:#bff7de; --dim:#6fb39a; --faint:#2f5a52; --glow:rgba(140,255,210,.35);
  --amber:#ffd36b;
}
*{box-sizing:border-box}
html,body{margin:0;background:#141720;color:var(--ink);font-family:"Nanum Gothic Coding",ui-monospace,monospace}
body{min-height:100vh;display:flex;justify-content:center;padding:14px 10px 28px}
button{font:inherit;color:inherit}
.device{width:100%;max-width:760px;background:linear-gradient(180deg,var(--bezel-hi),var(--bezel) 40%,var(--bezel-lo));
  border-radius:22px;padding:14px 14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08)}
.top{display:flex;align-items:center;gap:10px;padding:2px 6px 10px}
.led{width:10px;height:10px;border-radius:50%;background:#5cff9d;box-shadow:0 0 8px #5cff9d}
.brand{font-family:VT323,monospace;font-size:22px;letter-spacing:2px;color:#cfd6e6;background:none;border:0;padding:0;cursor:pointer}
.brand small{color:#8a93a8;font-size:16px;margin-left:6px}
.vents{display:flex;gap:4px}
@media(max-width:420px){.vents{display:none}}
.acct{margin-left:auto;appearance:none;border:1px solid #5d6680;background:var(--bezel-lo);color:#cfd6e6;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.acct.on{border-color:var(--ink);color:var(--ink);box-shadow:0 0 8px rgba(140,255,210,.35)}
.vents i{width:18px;height:4px;border-radius:2px;background:var(--bezel-lo);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 2px 10px}
/* ---- 고정 헤더 · 최상위 탭 · 하위 탭 ---- */
.hdr{position:sticky;top:0;z-index:30;margin:-14px -14px 10px;padding:14px 14px 10px;border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,var(--bezel-hi),var(--bezel));box-shadow:0 6px 12px -6px rgba(0,0,0,.6)}
.hdr .top{padding:0 6px 10px}
.hdr .nav{margin:0 2px}
.subtabs{display:flex;gap:2px;margin:-4px 0 14px;border-bottom:1px solid var(--faint)}
.subtabs:empty{display:none}
.subtabs button{appearance:none;flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;
  color:var(--dim);font-size:13px;padding:8px 4px 7px;cursor:pointer}
.subtabs button.on{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}
.bgos{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bgo{appearance:none;border:1px solid var(--bc);background:transparent;color:var(--bc);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer}
.bgo:active{background:var(--bc);color:#111}
/* ---- 카드: 진화 방법 · 100% CP ---- */
.how{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.how div{font-size:11.5px;color:var(--dim);line-height:1.45}
.how b{color:var(--ink);font-weight:700}
.how .cdy{color:var(--amber)}
.cpgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cpc{border:1px solid var(--faint);border-radius:8px;padding:4px 2px 5px;text-align:center;background:rgba(0,0,0,.25)}
.cpc .l{font-size:10px;color:var(--dim);line-height:1.3}
.cpc .v{font-family:VT323,monospace;font-size:19px;color:var(--amber);line-height:1.05}
.cpc .lv{font-family:VT323,monospace;font-size:12px;color:var(--dim)}
/* ---- 배틀 팀 짜기 ---- */
.tclr{appearance:none;border:1px solid var(--faint);background:none;color:var(--dim);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
.tslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.tslot{position:relative;border:1px dashed var(--faint);border-radius:10px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;background:rgba(0,0,0,.25);text-align:center}
.tslot.full{border-style:solid}
.tslot .nm2{font-size:12px;font-weight:700;line-height:1.25}
.tslot .tt{display:flex;gap:2px;justify-content:center}
.tslot .tt i{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.tslot .x{position:absolute;top:2px;right:4px;appearance:none;border:0;background:none;color:var(--dim);font-size:15px;cursor:pointer}
.tslot .emp{font-size:11.5px;color:var(--dim)}
.tslot .tier .tb{transform:scale(.8)}
.dtab{width:100%;border-collapse:collapse;font-size:12px}
.dtab th,.dtab td{padding:4px 3px;border-bottom:1px solid rgba(255,255,255,.05);text-align:center}
.dtab th{font-weight:400;color:var(--dim);font-size:11px}
.dtab td:first-child{text-align:left;white-space:nowrap}
.mk{display:inline-block;min-width:34px;border-radius:5px;padding:1px 3px;font-size:10.5px;font-weight:700}
.mk.w{background:#ff5d6c;color:#fff}.mk.ww{background:#b0122a;color:#fff}.mk.r{background:#2f9e6a;color:#fff}.mk.rr{background:#156b45;color:#fff}
.tw{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.recrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.recrow .info{flex:1;min-width:0}
.recrow .why{font-size:11px;color:var(--dim)}
.recrow .add{appearance:none;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer}
/* ---- 일정: 잡을 포켓몬 ---- */
.panel.hot{border-color:rgba(140,255,210,.45);box-shadow:0 0 14px rgba(140,255,210,.12) inset}
.panel h3 .vlegend{margin-left:auto;font-weight:400;font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:3px}
.vt{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.vlegend .vt{margin-left:4px}
.vt.vmust{background:#ff4f8b;color:#fff;box-shadow:0 0 8px rgba(255,79,139,.55)}
.vt.vrec{background:transparent;color:var(--amber);border:1px solid var(--amber)}
.vt.no{color:var(--dim);border:1px dashed var(--faint)}
.picks{display:flex;flex-direction:column;gap:5px}
.pick{display:flex;align-items:center;gap:8px;border-left:3px solid var(--bc);background:rgba(0,0,0,.26);border-radius:0 9px 9px 0;padding:5px 8px 5px 6px}
.pick .spr{width:40px;height:40px;flex:none}
.pick .pi{flex:1;min-width:0}
.pick .pc{font-size:10px;font-weight:700;color:var(--bc);letter-spacing:.5px}
.pick .pc small{color:var(--dim);font-weight:400;margin-left:4px}
.pick .pn{font-size:13.5px;font-weight:700;line-height:1.35}
.pick .pn a{color:inherit;cursor:pointer}
.pick .pr{font-size:11px;color:var(--dim);line-height:1.45}
.pick .pr b{color:var(--ink);font-weight:700}
.pick .bgo{flex:none;--bc:var(--ink)}
.pick.dimmed{opacity:.6}
.pick.slim{padding:4px 8px}
.pick.slim .pn{font-size:12.5px}
.plist{margin-top:10px;padding-top:9px;border-top:1px dashed var(--faint)}
.plh{font-size:12px;font-weight:700;margin:0 0 6px;color:var(--amber)}
.plh span{font-weight:400;color:var(--dim);font-size:11px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.mc{appearance:none;border:1px solid var(--faint);background:rgba(0,0,0,.25);border-radius:8px;padding:2px 2px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:var(--ink);min-width:0}
.mc .spr{width:40px;height:40px}
.mc{position:relative}
.mc .tb.mct{position:absolute;left:2px;top:2px;min-width:22px;height:17px;padding:0 3px;border-radius:5px;font-size:15px}
.mc .tb.mct.sp{font-family:inherit;font-size:10.5px;font-weight:700;background:#8ef0b0;letter-spacing:-.5px}
.plsub{font-size:11px;color:var(--dim);margin:8px 0 4px}
.plh+.plsub{margin-top:0}
.mc span{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dmust summary{list-style:none;cursor:pointer}
.dmust summary::-webkit-details-marker{display:none}
.dmust summary h3{margin:0}
.dmust[open] summary h3{margin-bottom:8px}
.dmust .chev{margin-left:auto;color:var(--dim);transition:transform .2s}
.dmust[open] .chev{transform:rotate(180deg)}
.dmust .cnt{font-weight:400;color:var(--dim);font-size:11px}
.evmore{appearance:none;width:100%;margin-top:6px;border:1px dashed var(--faint);background:none;color:var(--dim);border-radius:8px;padding:6px;font-size:12px;cursor:pointer}
.ev.cmp{padding:6px 9px}
.ev.cmp .s{display:none}
/* ---- 카드 이미지 저장 ---- */
.savebar{display:flex;justify-content:flex-end;margin:0 0 6px}
.savebtn{appearance:none;border:1px solid var(--ink);background:rgba(0,0,0,.3);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
.savebtn:disabled{opacity:.6}
.shot{position:fixed;left:-10000px;top:0;padding:12px 14px 8px;background:#0b1416;
  background-image:linear-gradient(rgba(140,255,210,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,255,210,.05) 1px,transparent 1px);background-size:18px 18px}
.shot .tcard{max-width:none}
.shot-by{font-family:VT323,monospace;font-size:13px;line-height:1;text-align:right;color:var(--dim);opacity:.8;margin:6px 6px 0}
.shotmodal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.shotbox{background:#11191c;border:1px solid var(--faint);border-radius:14px;padding:12px;max-width:min(460px,100%);max-height:100%;overflow:auto;text-align:center;color:var(--ink)}
.shotbox img{width:100%;border-radius:10px;display:block}
.shotbox p{font-size:12.5px;margin:8px 0}
.shot-tip{color:var(--dim)}
.howto{text-align:left;font-size:13.5px;line-height:1.65}
.howto h3{font-size:15px;margin:0 0 4px;color:var(--ink)}
.howto h4{font-size:13.5px;margin:12px 0 2px;color:var(--amber,#f2b84b)}
.howto ol{margin:0;padding-left:20px}
.howto li{margin:3px 0}
.howto p{font-size:13px;margin:6px 0}
.howto b{color:var(--ink)}
.shotbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.shotbtns button,.shotbtns a{appearance:none;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;text-decoration:none}
.shotbtns [data-share]{background:var(--ink);color:#0b2124;font-weight:700}
.ddmenu{position:absolute;z-index:40;min-width:150px;background:#1b2130;border:1px solid #5d6680;border-radius:12px;padding:5px;box-shadow:0 10px 24px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:2px}
.ddmenu button{appearance:none;border:0;background:none;color:#cfd6e6;text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.ddmenu button.on{background:var(--ink);color:#0b2124}
.ddmenu hr{border:0;border-top:1px solid #3a4258;margin:3px 4px}
.bxrow.sub2{margin-left:18px;opacity:.85;border-left:2px solid var(--faint);padding-left:6px}
.dmore{appearance:none;border:0;background:none;color:var(--amber);font-size:11.5px;padding:2px 0 6px 30px;cursor:pointer;font-family:inherit}
.bxrow .todo{color:var(--amber)}
.bxrow .todo b{font-weight:700}
.sbtn.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;min-height:0;padding:8px}
.allico{font-size:16px;color:var(--c)}
/* ---- 내 박스 ---- */
.boxbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px dashed var(--faint);border-radius:10px;padding:8px 10px;margin:0 0 12px;font-size:12.5px;color:var(--dim)}
.boxbar b{color:var(--ink)}
.boxbar .sp{flex:1}
.boxbar label,.boxbar button{appearance:none;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.boxbar input{display:none}
.bxrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.bxrow .rk{font-family:VT323,monospace;font-size:20px;color:var(--dim);width:20px;text-align:center}
.bxrow .spr{width:40px;height:40px;flex:none}
.bxrow .inf{flex:1;min-width:0}
.bxrow .nm{font-size:13.5px;font-weight:700}
.bxrow .sub{font-size:11px;color:var(--dim);line-height:1.45}
.bxrow .val{text-align:right;font-family:VT323,monospace;font-size:20px;color:var(--amber);line-height:1}
.bxrow .val small{display:block;font-family:inherit;font-size:12px;color:var(--dim)}
.bxrow .sub .tb{transform:scale(.72);transform-origin:left center;margin-right:-6px}
.bxrow .q{font-size:10px;border:1px dashed var(--dim);color:var(--dim);border-radius:4px;padding:0 3px;margin-left:4px}
.minebar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:10px 0 4px}
.minebar span{margin-right:auto;font-size:12.5px;font-weight:700;color:var(--amber)}
.minebar button{appearance:none;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.minebar:not(.on) button{background:var(--ink);color:#0b2124}
.own{display:inline-block;font-size:10.5px;border:1px solid var(--ink);color:var(--ink);border-radius:5px;padding:0 5px;margin-top:2px}
.own.none{border-style:dashed;border-color:var(--dim);color:var(--dim)}
.lbar{display:flex;gap:6px;align-items:stretch}
.lbar input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--faint);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit}
.lbar select,.edmon select{background:#11191c;border:1px solid var(--faint);color:var(--ink);border-radius:10px;padding:0 8px;font-size:12.5px;font-family:inherit}
.linfo{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--dim);margin:8px 2px 2px}
.linfo button,.lmore{appearance:none;border:1px solid var(--faint);background:none;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:11.5px;cursor:pointer;font-family:inherit}
.lmore{display:block;margin:10px auto 0;padding:7px 16px}
button.lrow{appearance:none;width:100%;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.06);color:inherit;font:inherit;text-align:left;cursor:pointer}
.lrow .ed{color:var(--dim);font-size:13px;margin-left:2px}
.edmon{text-align:left;font-size:12.5px}
.edhd{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:8px;min-height:40px}
.edhd .spr{width:40px;height:40px}
.edmon label{display:block;color:var(--dim);font-size:11.5px}
.edmon input[type=number],.edmon input:not([type]),.edmon select{display:block;width:100%;box-sizing:border-box;margin-top:3px;background:rgba(0,0,0,.3);border:1px solid var(--faint);color:var(--ink);border-radius:8px;padding:8px;font-size:14px;font-family:inherit;height:38px}
.edgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.edchk{display:flex;gap:16px;margin:10px 0 2px}
.edchk label{display:flex;align-items:center;gap:5px;color:var(--ink);font-size:13px}
.edmon .err{color:#ff8a8a;font-size:12px;min-height:16px;margin-top:6px}
.shotbtns [data-save]{background:var(--ink);color:#0b2124;font-weight:700}
.intro-top{font-size:13.5px;line-height:1.6;margin:2px 2px 12px}
.icard{border:1px solid var(--faint);border-radius:14px;padding:12px;margin:0 0 12px;background:rgba(0,0,0,.22)}
.icard h3{margin:0 0 3px;font-size:15.5px;color:var(--amber)}
.icard p{margin:0 0 9px;font-size:12.5px;line-height:1.55}
.demo{position:relative;max-height:330px;overflow:hidden;border:1px solid var(--faint);border-radius:10px;padding:6px 10px 0;background:#0b1416;pointer-events:none;user-select:none}
.demo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:54px;background:linear-gradient(rgba(11,20,22,0),#0b1416)}
.demo::before{content:"예시 화면";display:block;text-align:right;font-size:10px;color:var(--dim);margin-bottom:-4px}
.tsel{background:#11191c;border:1px solid var(--faint);color:var(--ink);border-radius:8px;padding:4px 6px;font-size:13px;font-family:inherit;margin:0 4px}
.impback{appearance:none;border:1px solid var(--amber);background:none;color:var(--amber);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.solo{border:1px solid var(--faint);border-radius:12px;padding:9px 11px;margin:10px 0 4px;background:rgba(0,0,0,.22)}
.solo.ok{border-color:var(--ink)}
.solo .st{font-size:14px;margin:7px 0 3px}
.solo .st b{color:var(--amber);font-size:16px}
.solo.ok .st b{color:var(--ink)}
.solo small{color:var(--dim);font-size:11px}
.solo .seg{margin:0}
.bossBig{border:1px solid var(--faint);border-radius:14px;padding:10px 12px 4px;margin:10px 0 4px;background:rgba(0,0,0,.22)}
.bbtop{display:flex;align-items:center;gap:12px}
.bbtop img{width:84px;height:84px;object-fit:contain;flex:none}
.bbtop>div{flex:1;min-width:0}
.bbname{font-size:19px;font-weight:700;margin-bottom:5px}
.bbtypes{display:flex;gap:4px;flex-wrap:wrap}
.bbtop .clr{appearance:none;border:1px solid var(--faint);background:none;color:var(--dim);border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer;align-self:flex-start}
.bossBig .mgrid{margin:10px 0 6px}
.myparty{display:flex;justify-content:flex-end;margin:6px 0 2px}
.myparty button{appearance:none;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.kakaobar{position:fixed;left:0;right:0;bottom:0;z-index:70;box-shadow:0 -6px 18px rgba(0,0,0,.5);background:#ffd36b;color:#2a1d00;font-size:12.5px;line-height:1.55;padding:9px 12px}
.kakaobar .kbtns{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 4px}
.kakaobar button{appearance:none;border:1px solid #2a1d00;background:none;color:#2a1d00;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.kakaobar button[data-kopen]{background:#2a1d00;color:#ffd36b}
.kakaobar small{font-size:11px;opacity:.85}
.bxsec{font-size:12px;font-weight:700;color:var(--amber);margin:12px 2px 4px}
.bxopt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);margin:2px 2px 8px}
.bxopt input{accent-color:var(--ink)}
.capform{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--faint);border-radius:10px;padding:8px 10px;margin:4px 0 10px}
.capform .spr{width:40px;height:40px}
.capform label{display:flex;flex-direction:column;font-size:11px;color:var(--dim);gap:2px}
.capform input,.capform select{width:52px;background:rgba(0,0,0,.35);border:1px solid var(--faint);color:var(--ink);border-radius:6px;padding:5px;font-size:14px;text-align:center}
.capform button{appearance:none;border:0;background:var(--ink);color:#0b2124;font-weight:700;border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;margin-left:auto}
.capstats{display:flex;flex-direction:column;font-size:11px;color:var(--dim);margin-top:2px}
.capstats .capbest{color:var(--amber);font-weight:700}
.capreco{border:1px solid var(--amber);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 4px;background:rgba(255,190,80,.08)}
.capdel{display:block;margin-top:6px;appearance:none;border:1px solid var(--faint);background:none;color:var(--dim);border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer;font-family:inherit}
/* 로그인 */
.loginbox{display:flex;flex-direction:column;gap:8px;text-align:left}
.loginbox label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
.loginbox input{background:rgba(0,0,0,.35);border:1px solid var(--faint);color:var(--ink);border-radius:8px;padding:8px;font-size:15px}
.loginbox .err{color:#ff7b8a;font-size:12px;min-height:16px}
/* ---- 내 정보 · 관리자 ---- */
.mecard{border:1px solid var(--faint);border-radius:12px;padding:10px 12px;margin:0 0 10px;background:rgba(0,0,0,.22)}
.mehd{font-size:13.5px;color:var(--dim);margin:0 0 8px;cursor:default}
.mehd b{color:var(--ink);font-family:VT323,monospace;font-size:20px;letter-spacing:1px}
details.mecard summary{list-style:none;cursor:pointer;margin:0}
details.mecard summary::-webkit-details-marker{display:none}
details[open].mecard summary{margin-bottom:8px}
.mestat{font-size:13px;color:var(--dim);line-height:1.6;margin:0 0 8px}
.mestat b{color:var(--ink)}
.merow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.mebtn{appearance:none;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;display:inline-block}
.mebtn.main{background:var(--ink);color:#0b2124;font-weight:700}
.mebtn.danger{border-color:#ff7b8a;color:#ff7b8a}
.mebtn.sm{padding:3px 9px;font-size:11px}
.mebtn:disabled{opacity:.5}
.adm{display:inline-block;background:#ff4f8b;color:#fff;border-radius:5px;padding:0 6px;font-size:11px;font-weight:700;margin-right:4px}
.adrow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.adrow small{color:var(--dim);font-size:11px}
.adrow span:last-child{white-space:nowrap}
.tmppw{font-family:VT323,monospace;font-size:34px;letter-spacing:3px;color:var(--amber);background:rgba(0,0,0,.35);border:1px dashed var(--amber);border-radius:10px;padding:6px 10px;margin:6px 0;user-select:all}
.ulbox{width:min(460px,100%);box-sizing:border-box}
.ulq{display:block;width:100%;box-sizing:border-box;background:rgba(0,0,0,.3);border:1px solid var(--faint);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;margin:0 0 6px}
.ulrow{text-align:left;cursor:pointer}
.ulrow .ed{color:var(--dim)}
.ulpg{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0 4px;font-size:12px;color:var(--dim)}
.ulpg button{appearance:none;border:1px solid var(--faint);background:none;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.ulpg button:disabled{opacity:.35;cursor:default}
.adlog{font-size:11.5px;color:var(--dim);padding:2px 0}
.upbtn{appearance:none;margin-top:10px;border:0;background:var(--ink);color:#0b2124;font-weight:700;border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
/* ---- 도감 ---- */
.regions{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding-bottom:2px}
.regions::-webkit-scrollbar{display:none}
.regions button{flex:none;appearance:none;border:1px solid var(--faint);background:rgba(0,0,0,.25);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.regions button.on{background:var(--ink);color:#0b2124;font-weight:700;border-color:var(--ink)}
.regions small{font-family:VT323,monospace;font-size:13px;opacity:.7;margin-left:3px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.dexcell{appearance:none;border:1px solid var(--faint);background:rgba(0,0,0,.28);border-radius:10px;padding:4px 2px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);min-width:0}
.dexcell:hover{border-color:var(--dim)}
.dexcell img,.dexcell .ph{width:56px;height:56px;image-rendering:pixelated;object-fit:contain}
.dexcell .no{font-family:VT323,monospace;font-size:13px;color:var(--dim);line-height:1}
.dexcell .nm2{font-size:11.5px;line-height:1.25;text-align:center;word-break:keep-all;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}

.skill{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.55;padding:2px 0 4px}
.skill .tchip{flex:none;margin-top:1px}
.skill .elite{color:var(--amber);font-weight:700}
.skill .alt{font-size:11.5px;color:var(--dim);margin-top:2px}
.skill .plusbox{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:8px}
.skill .plusmv{font-size:12px;white-space:nowrap}
.skill .plusmv small{color:var(--dim);font-size:10.5px}
.skill .plusmv .tag{margin:0 3px 0 0}
.skill.s2{margin-top:2px}
.skill .s2l{flex:none;font-size:10.5px;line-height:1.25;color:var(--dim);width:58px;text-align:center;border:1px dashed var(--faint);border-radius:6px;padding:2px 0}
.tchip.sm{transform:scale(.85);transform-origin:left center;margin-right:-6px}
.sknote{font-size:12.5px;color:var(--dim);line-height:1.6}
.sknote b{color:var(--ink)}
.skgo{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.skgo button{appearance:none;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer}

.devnote{margin:0 2px 12px;padding:9px 11px;border:1px dashed var(--amber);border-radius:10px;background:rgba(255,211,107,.08);font-size:12.5px;line-height:1.6;color:var(--ink)}
.devnote a{color:var(--amber);text-decoration:underline;text-underline-offset:3px;word-break:break-all}

.roleSw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.roleSw .rb{appearance:none;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 6px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;
  border:2px solid var(--rc);background:rgba(0,0,0,.3);color:var(--rc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.roleSw .rb svg{width:20px;height:20px}
.roleSw .rb.tank{--rc:#5aa8ff}.roleSw .rb.deal{--rc:#ff7a4d}
.roleSw .rb.on{background:var(--rc);color:#0b1418;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 55%,transparent), inset 0 2px 0 rgba(255,255,255,.25)}
.bsearch{margin:2px 0 4px}
.bossCard{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 2px 4px;font-size:13px}
.bossCard b{font-size:15px}
.bossCard .clr{margin-left:auto;appearance:none;border:1px solid var(--faint);background:none;color:var(--dim);border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer}

.roles{margin:0 0 10px}
.gopt{margin:-2px 0 10px}
.nav button{appearance:none;border:0;border-radius:10px;padding:10px 0 9px;background:var(--bezel-lo);color:#b4bccd;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06)}
.nav button.on{color:#0b2124;background:var(--ink);box-shadow:0 0 14px rgba(140,255,210,.45), inset 0 2px 0 rgba(255,255,255,.35)}
.screen{position:relative;background:var(--screen);border-radius:12px;padding:14px 12px 16px;overflow:hidden;min-height:420px;
  box-shadow:inset 0 0 0 2px #061214, inset 0 0 40px rgba(0,0,0,.65);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px}
.screen::after{content:"";pointer-events:none;position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.view{display:none}.view.on{display:block}
.label{font-family:VT323,monospace;font-size:18px;color:var(--dim);letter-spacing:1px;margin:2px 2px 8px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---- 공통 ---- */
.tb{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 4px;border-radius:7px;font-family:VT323,monospace;font-size:24px;color:#0b2124;line-height:1}
.tb.SS{background:#ff5f8f;box-shadow:0 0 10px rgba(255,95,143,.55)}.tb.S{background:#ff9a62}.tb.A{background:#ffd36b}
.tb.B{background:#8ef0b0}.tb.C{background:#8ab8ff}.tb.D{background:#5d6b7a;color:#dfe6ee}.tb.N{background:transparent;border:1px dashed var(--faint);color:var(--dim)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 4px;font-size:11.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.legend .tb{min-width:24px;height:22px;font-size:18px}
.mobnote{font-size:11px;color:var(--dim);opacity:.8;padding:6px 2px 0}
.rkask{padding:14px 6px}
.note{margin-top:14px;border-top:1px dashed var(--faint);padding-top:10px;font-size:11.5px;color:var(--dim);line-height:1.6}
.note b{color:var(--ink)}
.panel{margin-top:12px;border:1px solid var(--faint);border-radius:12px;padding:10px 11px;background:rgba(0,0,0,.22)}
.panel h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.panel p{margin:4px 0 0;font-size:11.5px;color:var(--dim);line-height:1.6}
.empty{padding:30px 10px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
.tchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 7px 2px 4px;border-radius:999px;background:color-mix(in srgb,var(--tc) 28%,transparent);border:1px solid var(--tc);white-space:nowrap}
.tchip svg{width:13px;height:13px}

/* ---- 홈 ---- */
.boot{font-family:VT323,monospace;font-size:17px;color:var(--dim);line-height:1.25;margin:0 2px 10px}
.boot .ok{color:#5cff9d}
.clock{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.clock h1{margin:0;font-size:19px;text-shadow:0 0 10px var(--glow)}
.clock span{font-family:VT323,monospace;font-size:18px;color:var(--amber)}
.bosses{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.boss{border:1px solid var(--faint);border-radius:10px;padding:8px 9px;background:rgba(0,0,0,.28)}
.boss .k{font-family:VT323,monospace;font-size:15px;letter-spacing:1px;color:var(--bc)}
.boss .n{font-size:13px;font-weight:700;margin:2px 0 3px;line-height:1.35}
.boss .n a{color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.boss .d{font-size:10.5px;color:var(--dim)}
.boss.none{opacity:.5}
.evlist{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:9px;align-items:start;border-left:3px solid var(--ec);background:rgba(0,0,0,.26);border-radius:0 9px 9px 0;padding:8px 9px}
.ev .dt{font-family:VT323,monospace;font-size:17px;line-height:1.05;color:var(--ink)}
.ev .dt small{display:block;font-size:13px;color:var(--dim)}
.ev .cat{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--ec);color:#0b2124;font-weight:700;margin-right:5px;vertical-align:1px}
.ev .t{font-size:13px;font-weight:700;line-height:1.4}
.ev .s{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.ev .s a{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.ev .left{font-family:VT323,monospace;font-size:14px;color:var(--amber);margin-left:4px}

/* ---- 카드 검색 ---- */
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;background:rgba(0,0,0,.4);border:1px solid var(--faint);border-radius:9px;color:var(--ink);padding:10px 11px;font:inherit;font-size:15px}
.search input::placeholder{color:var(--faint)}
.search button{appearance:none;border:0;background:var(--ink);color:#0b2124;border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px;min-height:27px;align-items:center}
.sugg.recent{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sugg.recent::-webkit-scrollbar{display:none}
.sugg .chip{flex:none;white-space:nowrap}
.sugg .hint{flex:none;font-size:11.5px;color:var(--dim)}
.chip{appearance:none;border:1px solid var(--faint);background:rgba(0,0,0,.25);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
/* 트레이딩 카드 */
.tcard{max-width:440px;margin:0 auto;border-radius:18px;padding:7px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#fff 15%),var(--c) 40%,color-mix(in srgb,var(--c) 60%,#000));
  box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 22px color-mix(in srgb,var(--c) 35%,transparent)}
.tcard-in{border-radius:13px;background:#0e1d22;overflow:hidden;position:relative}
.tcard-in::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,rgba(180,255,240,.05) 50%,transparent 62%)}
.ctop{display:grid;grid-template-columns:112px 1fr;gap:11px;padding:11px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,transparent),transparent)}
.pic{position:relative;width:112px;height:112px;border-radius:12px;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%),rgba(0,0,0,.45);
  border:2px solid color-mix(in srgb,var(--c) 70%,#fff 10%)}
.pic .ph{position:absolute;left:50%;top:46%;width:52%;height:52%;transform:translate(-50%,-50%);opacity:.8}
.pic .no{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:VT323,monospace;font-size:15px;color:var(--ink)}
.pic img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.cname{font-size:19px;font-weight:700;line-height:1.2;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cname small{font-family:VT323,monospace;font-size:16px;color:var(--dim);font-weight:400}
.ctype{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0 8px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.sumc{border:1px solid rgba(191,247,222,.18);border-radius:9px;padding:5px 3px 5px;text-align:center;background:rgba(0,0,0,.3)}
.sumc .m{font-size:10.5px;color:var(--dim)}
.sumc .tb{margin:3px 0 2px;min-width:34px;height:30px}
.sumc .w{font-size:9.5px;color:var(--dim);line-height:1.25;min-height:12px;word-break:keep-all}
.cbody{padding:4px 12px 10px}
.sec{font-family:VT323,monospace;font-size:15px;color:var(--dim);letter-spacing:1px;margin:8px 0 5px;display:flex;align-items:center;gap:6px}
.sec::after{content:"";flex:1;height:1px;background:rgba(111,179,154,.25)}
.evo{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.stage{display:flex;flex-direction:column;gap:3px}
.evo .arw{color:var(--dim);font-family:VT323,monospace;font-size:18px}
.evo button{appearance:none;border:1px solid var(--faint);background:rgba(0,0,0,.3);border-radius:7px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--ink);text-align:left;white-space:nowrap}
.evo button.cur{background:var(--ink);color:#0b2124;font-weight:700;border-color:var(--ink)}
.evo .branch{font-size:10px;color:var(--dim)}
.drow{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:7px 0;border-top:1px solid rgba(111,179,154,.15)}
.drow:first-of-type{border-top:0}
.drow .k{font-size:12.5px;padding-top:4px}
.forms{display:flex;flex-direction:column;gap:4px}
.form{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
.form.tl,.sumc.tl{cursor:pointer}
.form.tl u{text-decoration:underline dotted;text-underline-offset:3px;color:var(--ink)}
.tlgo{font-style:normal;color:var(--ink);font-size:10px;margin-left:1px}
.sumc.tl .w::after{content:" ▸";color:var(--ink);font-size:10px}
.shot .sumc.tl .w::after,.shot .tlgo{display:none;content:none}
.shot .form.tl u{text-decoration:none;color:inherit}
tr.flash td{animation:flashrow 2.2s ease-out}
@keyframes flashrow{0%,40%{background:rgba(255,211,107,.28)}100%{background:transparent}}
.form .tb{min-width:28px;height:24px;font-size:19px}
.form b{color:var(--ink);font-weight:700}
.cfoot{display:flex;justify-content:space-between;padding:6px 12px 8px;font-family:VT323,monospace;font-size:13px;color:var(--dim);border-top:1px solid rgba(111,179,154,.15)}

/* ---- 티어 보드 공통 ---- */
.sels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sels.three{grid-template-columns:repeat(3,1fr)}
.sbtn{appearance:none;border:1px solid var(--faint);background:rgba(0,0,0,.25);color:var(--ink);border-radius:8px;
  padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:11.5px}
.sbtn svg{width:22px;height:22px}
.sbtn.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}
.sbtn.off{opacity:.35}
.head{display:flex;align-items:center;gap:10px;margin:16px 2px 10px}
.head .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 30%,transparent);border:1px solid var(--c)}
.head .ico svg{width:24px;height:24px}
.head h2{margin:0;font-size:18px;text-shadow:0 0 8px var(--glow)}
.head .cnt{margin-left:auto;font-family:VT323,monospace;font-size:18px;color:var(--dim)}
.tabs{display:flex;border:1px solid var(--faint);border-radius:9px;overflow:hidden;margin-bottom:10px}
.tab{flex:1;appearance:none;border:0;background:transparent;color:var(--dim);padding:9px 6px;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:#0b2124;font-weight:700}
table{width:100%;border-collapse:separate;border-spacing:0 5px}

.monrow{display:flex;align-items:center;gap:6px;min-width:0}
.spr{flex:none;width:34px;height:34px;image-rendering:pixelated;object-fit:contain;margin:-4px -2px -4px -4px}

.mgrid{display:flex;flex-direction:column;gap:5px;margin:10px 2px}
.mrow{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:6px}
.mrow .ml{font-size:12px;color:var(--dim);white-space:nowrap}
.mrow .mc{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;border:0;background:none;padding:0;border-radius:0;cursor:default}

@media (max-width:440px){
  body{padding:8px 6px 20px}
  .device{padding:10px 8px 12px;border-radius:18px}
  .screen{padding:12px 8px 14px}
  .sels{gap:4px}
  .sbtn{font-size:10.5px;padding:5px 0 4px}
  .nm{font-size:12px}.mv{font-size:9.5px}
  .spr{width:28px;height:28px}
  td.num{font-size:16px} td.num .p{font-size:10.5px}
  th button{font-size:10.5px;padding:2px 3px}
  .ctop{grid-template-columns:96px 1fr;gap:9px;padding:9px}
  .pic{width:96px;height:96px}
  .cname{font-size:17px}
}

<script>
// 카카오톡 안 브라우저면 기본 브라우저(크롬·삼성 인터넷 등)로 같은 주소(초대 링크 포함)를 다시 엶.
// 카톡 브라우저는 로그인 정보가 따로 저장되고 파일 올리기도 막혀서. 안 넘어가면 아래 안내 띠(kakaoBar)로 직접 열게 함
const IN_KAKAO=/KAKAOTALK/i.test(navigator.userAgent), ORIG_URL=location.href;
const openExternal=()=>{ location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(ORIG_URL); };
if(IN_KAKAO) setTimeout(()=>{ try{ openExternal(); }catch(e){} },300); // 화면(안내 띠)을 먼저 그린 뒤 넘김

// ===== 타입 =====
const TYPES = [
 ["normal","노말","#a8a77a"],["fire","불꽃","#ff7f3f"],["water","물","#4f92ff"],["grass","풀","#5fc45a"],
 ["electric","전기","#f6d33c"],["ice","얼음","#7fe0e0"],["fighting","격투","#d0463f"],["poison","독","#b45bd1"],
 ["ground","땅","#d8b25a"],["flying","비행","#97a9f7"],["psychic","에스퍼","#ff5e8e"],["bug","벌레","#a8c52a"],
 ["rock","바위","#b9a14e"],["ghost","고스트","#7660b8"],["dragon","드래곤","#6f4bff"],["dark","악","#8a6c5c"],
 ["steel","강철","#9fb4c8"],["fairy","페어리","#f19ad6"]
];
const TC = Object.fromEntries(TYPES.map(t=>[t[0],t[2]]));
const TN = Object.fromEntries(TYPES.map(t=>[t[0],t[1]]));

// 직접 그린 단순 타입 아이콘 (24x24)
const ICON = {
 normal:'<circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/>',
 fire:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3-1-3 0-6 1-9z" fill="currentColor"/>',
 water:'<path d="M12 3c3 5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6 6-11z" fill="currentColor"/>',
 grass:'<path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14z" fill="currentColor"/><path d="M6 18L15 9" stroke="#0b2124" stroke-width="1.6"/>',
 electric:'<path d="M13 2L5 13h6l-2 9 9-12h-6l2-8z" fill="currentColor"/>',
 ice:'<g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></g>',
 fighting:'<rect x="5" y="8" width="14" height="10" rx="3" fill="currentColor"/><g stroke="#0b2124" stroke-width="1.5"><path d="M9 8v5M12.5 8v5M16 8v5"/></g><rect x="7" y="5" width="10" height="4" rx="2" fill="currentColor"/>',
 poison:'<circle cx="9" cy="14" r="5" fill="currentColor"/><circle cx="16" cy="8" r="3.2" fill="currentColor"/><circle cx="17.5" cy="16.5" r="2" fill="currentColor"/>',
 ground:'<path d="M3 18l6-9 4 5 3-3 5 7z" fill="currentColor"/><path d="M3 21h18" stroke="currentColor" stroke-width="2"/>',
 flying:'<path d="M3 14c4-1 7-5 9-10 0 6 3 9 9 10-5 1-8 4-9 7-1-4-4-6-9-7z" fill="currentColor"/>',
 psychic:'<path d="M12 12m-1 0a1 1 0 1 1 2 0a3 3 0 1 1-6 0a5 5 0 1 1 10 0a7 7 0 1 1-14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 bug:'<ellipse cx="12" cy="14" rx="5" ry="6.5" fill="currentColor"/><path d="M10 7L7 3M14 7l3-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 8v12" stroke="#0b2124" stroke-width="1.4"/>',
 rock:'<path d="M5 15l3-8 7-3 5 6-2 9H8z" fill="currentColor"/><path d="M8 7l4 5 8-2M12 12l-4 7" stroke="#0b2124" stroke-width="1.2" fill="none"/>',
 ghost:'<path d="M5 21V11a7 7 0 0 1 14 0v10l-2.5-2-2.3 2-2.2-2-2.2 2-2.3-2z" fill="currentColor"/><circle cx="9.5" cy="11" r="1.5" fill="#0b2124"/><circle cx="14.5" cy="11" r="1.5" fill="#0b2124"/>',
 dragon:'<path d="M4 20C6 12 10 6 20 4c-4 3-5 6-5 9 2-1 3-1 5-1-4 3-8 6-16 8z" fill="currentColor"/>',
 dark:'<path d="M15 3a9 9 0 1 0 6 15A8 8 0 0 1 15 3z" fill="currentColor"/>',
 steel:'<path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z" fill="currentColor"/><circle cx="12" cy="12" r="3.2" fill="#0b2124"/>',
 fairy:'<path d="M12 2l2.6 6.6L21 9.5l-5 4.4 1.6 7.1L12 17.3 6.4 21 8 13.9 3 9.5l6.4-.9z" fill="currentColor"/>'
};
const svg = (t,c)=>`<svg viewBox="0 0 24 24" style="color:${c||TC[t]}" aria-hidden="true">${ICON[t]}</svg>`;


// ===== 도감 데이터 (data/pokedex.json, 매주 자동 갱신) =====
let DEX=null, CARDS={}, NAME2ID={}, SEARCH=[];
// 티어 규칙 (빌드 스크립트와 동일, pokedex.json의 tierRule로 덮어씀) — v3.5: 타입을 가리지 않는 절대 등급
// 점수 ÷ 기준 점수(ref: 모드별 5위 모습의 점수) → % 구간으로 S+ ~ C-. 배틀은 개수(pvpCaps)로만.
let TIER_RULE={names:["S+","S","S-","A+","A","A-","B+","B","B-","C+","C","C-"],minPct:[95,88,82,76,70,64,58,52,46,40,34,28],refRank:5,pvpCaps:[3,3,4,5,5,5,5,5,5,0,0,0],ref:{raid:90,dmax:480}};
const ORDER=t=>t?TIER_RULE.names.indexOf(t):99;
const gradeOf=pct=>{ const i=TIER_RULE.minPct.findIndex(m=>pct>=m); return i<0?null:TIER_RULE.names[i]; };
const TL=(c,mode,side)=>c.tiers?.[mode]?.[side]||[];
// 각 행에 _t(티어|null) 기록. ref가 있으면 절대 등급, 없으면(배틀) 정렬된 순서대로 개수 상한
function assignTiers(rows, metric, ref){
  if(ref){ for(const r of rows) r._t=gradeOf(r[metric]/ref*100); return rows; }
  const R=TIER_RULE; let level=0, n=0;
  for(const r of rows){ while(level<R.names.length&&n>=R.pvpCaps[level]){ level++; n=0; } r._t=level<R.names.length?R.names[level]:null; if(r._t) n++; }
  return rows;
}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const legendHTML=()=>TIER_RULE.names.map((t,i)=>`<span>${TB(t)}${TIER_RULE.minPct[i]}%↑</span>`).join("")+`<span><i class="tb N">—</i>순위권 밖</span>`;
const TB=t=>t?`<span class="tb ${t==="S+"?"SS":t[0]}">${t}</span>`:`<span class="tb N" title="순위권 밖">—</span>`;
const LEAGUES=[["great","슈퍼리그","#4f92ff"],["ultra","하이퍼리그","#ffd36b"],["master","마스터리그","#b45bd1"]];
const LN=Object.fromEntries(LEAGUES.map(l=>[l[0],l[1]]));
const LEAGUE_ICON={
 great:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M4 12h16" stroke="currentColor" stroke-width="2.4"/>',
 ultra:'<path d="M12 3l8 5v8l-8 5-8-5V8z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 10h8M8 14h8" stroke="currentColor" stroke-width="2"/>',
 master:'<path d="M3 8l4 3 5-7 5 7 4-3-2 11H5z" fill="currentColor"/>'
};
const lgSvg=(k,c)=>`<svg viewBox="0 0 24 24" style="color:${c}" aria-hidden="true">${LEAGUE_ICON[k]}</svg>`;

// ===== 라우팅 =====
const VIEWS=["home","card","dex","type","rocket","raid","dmax","pvp","boxparty","boxdust","boxcap","boxlist","intro","guide","updates","me","admin"];
// 아래 탭(5개) → 하위 탭 묶음 (마지막으로 본 하위 탭을 기억). 새 기능은 공략·더보기 안에 넣는다.
const GROUPS={ pokemon:{subs:[["card","포켓몬 검색"],["dex","도감"]],last:"card"},
               tier:{subs:[["raid","레이드"],["dmax","다이맥스"],["pvp","배틀리그"]],last:"raid"},
               strat:{subs:[["type","상성표"],["rocket","로켓단"]],last:"type"},
               my:{subs:[["boxparty","파티 추천"],["boxdust","강화 효율"],["boxcap","은뚜껑 추천"],["boxlist","내 포켓몬"],["me","내 정보"]],last:"boxparty"},
               more:{subs:[["home","일정"],["guide","왕초보 가이드"],["intro","회원 기능 소개"],["updates","업데이트"]],last:"home"} };  // 더보기: 하위 탭 없이 위로 펼치는 메뉴(toggleMore)
const GUEST_SUBS=GROUPS.my.subs.filter(([k])=>k!=="me"); // 비회원: 내 정보(로그인) 탭 없음 — 로그인은 맨 위 버튼으로
const isMem=()=>!!(ME&&!ME.mustChange);
// 주소 #p=포켓몬id 는 포켓몬 카드 화면 (카드 링크를 보내면 그 포켓몬이 바로 열림)
const hv=()=>{ const h=location.hash.slice(1); return h.startsWith("p=")?"card":h; };
function closeMenu(){ const h=$("#hsugg"); if(h) h.innerHTML=""; }
const groupOf=v=>v==="admin"?"my":Object.keys(GROUPS).find(g=>GROUPS[g].subs.some(([k])=>k===v));
function show(){
  let v=hv(); if(GROUPS[v]&&!VIEWS.includes(v)) v=GROUPS[v].last; if(!VIEWS.includes(v)) v="card";
  let g=groupOf(v), subs=g?GROUPS[g].subs:[];
  if(!isMem()&&v==="me"){ g=null; subs=[]; }   // 비회원 로그인 화면: 하위 탭 없이 따로
  else if(!isMem()&&g==="my"){ GROUPS.my.last=v; subs=GUEST_SUBS; }   // 비회원: 회원 기능 탭은 보이되 내용은 안내만
  else if(g==="more") subs=[];   // 더보기 안 화면은 각각 따로 된 페이지
  else if(g){ if(v!=="admin") GROUPS[g].last=v; }
  VIEWS.forEach(x=>$("#v-"+x).classList.toggle("on",x===v));
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.nav===g));
  $("#subnav").innerHTML=subs.map(([k,l])=>`<button data-go="${k}" class="${k===v?"on":""}">${l}</button>`).join("");
  const pm=location.hash.match(/^#p=(.+)$/); if(pm&&DEX){ let id=pm[1]; try{ id=decodeURIComponent(id); }catch(e){} if(CARDS[id]&&id!==CUR_ID) openCard(id); }
  if(v==="dex") renderDex();
  if(v.startsWith("box")) renderBox(v);
  if(v==="me") renderMe();
  if(v==="admin") renderAdmin();
  if(v==="type") renderType();
  if(v==="home") renderHome();
  if(v==="intro") renderIntro();
  if(v==="rocket") renderRocket();
  if(v==="guide") renderGuide();
  if(v==="updates") renderUpdates();
  closeMore();
  $("#acctBtn").classList.toggle("on",v==="me");
  if(v==="card"&&CUR_ID&&location.hash!=="#p="+CUR_ID){ try{ history.replaceState(null,"","#p="+CUR_ID); }catch(e){} }
  window.scrollTo(0,0);
  if(v==="guide"&&GUIDE_FOCUS) guideFocus();
}
function go(v){ if(GROUPS[v]&&!VIEWS.includes(v)) v=GROUPS[v].last; if(hv()===v) show(); else location.hash=v; }
document.addEventListener("click",e=>{
  if(!e.target.closest(".hsearch")) closeMenu();
  if(!e.target.closest("#tabbar")) closeMore();
  const nb=e.target.closest("[data-nav]"); if(nb){ const k=nb.dataset.nav; if(k==="more"){ toggleMore(); return; } closeMore(); go(k==="my"?(!isMem()&&GROUPS.my.last==="me"?"boxparty":GROUPS.my.last):k); return; }
  const gk=e.target.closest("[data-gk]"); if(gk){ GUIDE_TAB="ev"; GUIDE_FOCUS=gk.dataset.gk; go("guide"); return; }
  const gt=e.target.closest("[data-gt]"); if(gt){ GUIDE_TAB=gt.dataset.gt; GUIDE_FOCUS=null; renderGuide(); window.scrollTo(0,0); return; }
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const bo=e.target.closest("[data-boss]"); if(bo){ openBoss(bo.dataset.boss,bo.dataset.bm); return; }
  const p=e.target.closest("[data-poke]"); if(p){ openCard(p.dataset.poke); go("card"); }
});
window.addEventListener("hashchange",show);

// ===== 홈: 이벤트 피드 =====
// 수집: 2026-11-17 (Pokémon GO Hub, pokemongo.com 공지 기준). 시간은 현지(한국) 시간.
let FEED_UPDATED="2026-11-17", FEED_SOURCE="Pokémon GO Hub, pokemongo.com 공지 (수동 수집)";
const CAT={ event:["이벤트","#8ef0b0"], raid:["레이드","#ff7a8a"], mega:["메가","#a58bff"], shadow:["그림자","#c27bff"], max:["맥스배틀","#ff5fa8"],
  cday:["커뮤데이","#ffd36b"], spot:["스포트라이트","#7fd3ff"], hour:["레이드아워","#ff9a62"], pass:["GO 패스","#9fb4c8"] };
// [분류, 제목, 시작, 끝, 설명, 관련 포켓몬]
let EVENTS=null; // events.json을 받을 때까지 비워 둠 (내장 일정은 실패 시에만 사용)
const FALLBACK_EVENTS=[
 ["pass","GO 패스: 11월","2026-11-03T10:00","2026-12-01T10:00","보상에 그란돈 만남 포함",["그란돈"]],
 ["shadow","그림자 레이드: 그림자 토네로스(화신폼)","2026-11-03T00:00","2026-12-01T23:59","주말에만 등장",[]],
 ["raid","5성 레이드: 크레세리아 · 다크라이","2026-11-09T10:00","2026-11-25T10:00","",["크레세리아","다크라이"]],
 ["event","메테노 유성우: 사자자리","2026-11-14T10:00","2026-11-19T21:00","메테노(유성의 모습) 등장 · 매일 17–21시 관측 추천",[]],
 ["event","다이맥스 트레일","2026-11-16T10:00","2026-11-23T20:00","무한다이노 재등장 · 파워스폿 활성화 증가 · 테마 야생 출현",["무한다이노"]],

function fmtRange(a,b){

// 탱커 티어 기준: 종합(모든 공격 타입 평균) 5위의 값 (게이지 반영 여부마다 따로)
const TANK_REFS={}; const TANK_REF=g=>TANK_REFS[g?1:0]??=(()=>{ const v=dmaxTankRows("all","all",g).map(r=>r.tr).sort((a,b)=>b-a); return v[Math.min(TIER_RULE.refRank,v.length)-1]||1; })();
function tankBest(){ // 다이맥스 탱커 티어: "종합"(모든 공격 타입 평균) 내구 기준, 제곱근 없이 (v3.8)
  if(TANK_BEST) return TANK_BEST; const m={};
  const rows=dmaxTankRows("all","all",false).sort((a,b)=>b.tr-a.tr); assignTiers(rows,"tr",TANK_REF(false));
  rows.forEach((r,i)=>{ if(r._t) m[r.id]={t:r._t,w:"종합",r:i+1,p:Math.round(r.tr/rows[0].tr*100)}; });

}
// mode: "max" = 다이맥스, "shadow" = 그림자 레이드, 그 외 = 레이드
function judge(id,mode){
  const c=CARDS[id]; if(!c||!DEX) return null;
  const finals=c.final?[id]:c.evo[c.evo.length-1].filter(f=>CARDS[f]);
  const parts=[]; let top=null;
  const add=(t,txt)=>{ if(!t) return; parts.push(txt); if(!top||ORDER(t)<ORDER(top)) top=t; };
  if(mode==="max"){
    const tb=tankBest();
    for(const f of finals){ const F=CARDS[f], pre=f!==id?`${esc(F.ko)} `:"";
      const d=bestOf(TL(F,"dmax","n")), k=tb[f];
      add(d?.t,`${pre}딜러 <b>${d?.t}</b> ${esc(d?.w||"")}`);
      add(k?.t,`${pre}탱커 <b>${k?.t}</b>`);
    }
    if(!parts.length&&!finals.some(f=>CARDS[f].dmx||dmaxTankPool().some(e=>e.id===f))) parts.push("다이맥스 정보 아직 없음");
  }else{
    const sh=mode==="shadow";
    for(const f of finals){ const F=CARDS[f], x=bestOf(TL(F,"raid",sh?"s":"n")); if(!x) continue;
      const who=noPlus(x.f), pre=!["일반","그림자"].includes(who)?who:f!==id?(sh?"그림자 ":"")+F.ko:"";
      add(x.t,`${pre?esc(pre)+" ":""}레이드 <b>${x.t}</b> ${esc(x.w)}${plusOf(x.f)?" +기술MAX":""}`); }
  }
  const pv=bestOf(tiersFor(c,"pvp",mode==="shadow").list);
  if(pv&&VERDICT(pv.t)==="must") parts.push(`배틀 <b>${pv.t}</b> ${esc(noteOf(pv))}`);
  return {v:VERDICT(top),top,txt:parts.length?parts.join(" · "):"순위권 밖", to:finals.filter(f=>f!==id).map(f=>CARDS[f].ko)};
}

function ownTag(id,cat){ if(!hasBox()) return ""; const c=CARDS[id], fam=new Set((c.evo||[]).flat()); fam.add(id); let n=0,best=-1;
  for(const m of BOX.rows){ if(!fam.has(m.id)||(cat==="shadow")!==!!m.sh) continue; if(cat==="max"&&!canDmax(m,true)) continue; n++; if(m.iv>best) best=m.iv; }
  return n?`<span class="own">보유 ${n}마리 · 최고 ${Math.round(best)}%</span>`:`<span class="own none">미보유</span>`; }
const PICK_CATS=["raid","mega","max","shadow"];
// 일정 → [ {id,cat,e} ] (같은 포켓몬·분류는 한 번만)
function eventPicks(list,skip){
  const out=[], seen=new Set(skip||[]);
  for(const e of list){ if(!PICK_CATS.includes(e[0])||/아워/.test(e[1])) continue;
    for(const n of e[5]||[]){ const id=n2id(n); if(!id) continue; const k=e[0]+":"+id; if(seen.has(k)) continue; seen.add(k); out.push({id,cat:e[0],e}); } }
  const vo=x=>{ const j=judge(x.id,x.cat==="max"?"max":x.cat==="shadow"?"shadow":"raid"); return j?.v==="must"?0:j?.v==="rec"?1:2; };
  return out.sort((a,b)=>vo(a)-vo(b));
}

function dmaxPickTier(id){
  const c=CARDS[id]; if(!c||!DEX) return null;
  const finals=c.final?[id]:c.evo[c.evo.length-1].filter(f=>CARDS[f]), tb=tankBest(), pool=dmaxTankPool(); let best=null;
  const add=(t,r)=>{ if(t&&(!best||ORDER(t)<ORDER(best.t))) best={t,r}; };
  for(const f of finals){ for(const x of TL(CARDS[f],"dmax","n")) if(!/거다이/.test(x.f)) add(x.t,"딜러");
    if(tb[f]&&pool.find(p=>p.id===f)?.d) add(tb[f].t,"탱커"); }
  return best;
}

function tiersFor(c, mode, sh){
  const r=tiersFor0(c,mode,sh); if(mode!=="dmax"||sh) return r;
  const tb=tankBest(), ids=c.final?[c.id]:c.evo[c.evo.length-1].filter(id=>CARDS[id]), multi=ids.length>1;
  // 이름 규칙(모든 모드 같게): [분기 진화일 때만 "최종진화 "] + 모습(다이맥스/거다이맥스) + 역할(딜러/탱커)
  const tanks=ids.map(fid=>{ const t=tb[fid]; if(!t) return null; const e=dmaxTankPool().find(x=>x.id===fid);
    return {...t,f:(multi?CARDS[fid].ko+" ":"")+(e&&!e.d?"거다이맥스":"다이맥스")+" 탱커",tank:1,fid}; }).filter(Boolean);
  const deal=r.list.map(x=>({...x,f:x.f+" 딜러"}));
  return {list:[...deal,...tanks].sort((a,b)=>ORDER(a.t)-ORDER(b.t)||b.p-a.p), via:r.via};
}
function tiersFor0(c, mode, sh){
  const side=sh?"s":"n", own=TL(c,mode,side);
  if(c.final||(mode==="pvp"&&own.length)) return {list:own, via:null};
  const finals=c.evo[c.evo.length-1].filter(id=>CARDS[id]), multi=finals.length>1;
  // 진화 전 카드도 최종 진화 카드와 같은 이름(일반/그림자/다이맥스/메가○○ …). 분기 진화일 때만 앞에 "최종진화 "를 붙여 구분
  const list=finals.flatMap(fid=>{ const f=CARDS[fid];
    return TL(f,mode,side).map(x=>({...x, f:(multi&&!x.f.includes(f.ko)?`${f.ko} `:"")+x.f, fid}));
  }).sort((a,b)=>ORDER(a.t)-ORDER(b.t)||b.p-a.p);
  return {list, via:finals.map(id=>CARDS[id].ko)};
}
const hasShadow=c=>c.shadow||(!c.final&&c.evo[c.evo.length-1].some(id=>CARDS[id]?.shadow));
const PLUS_TXT=" (플러스 기술)", plusOf=t=>t.includes(PLUS_TXT), noPlus=t=>t.replace(PLUS_TXT,"");

const ptag=name=>(DEX?.plusEst||[]).some(n=>String(name||"").includes(n))?'<span class="tag p">+기술MAX·예측</span>':PTAG;
function noteOf(x){ if(["일반","그림자"].includes(x.f)) return x.w; if(x.f.includes(x.w)) return x.f; return `${x.f} · ${x.w}`; }
// 티어 줄·요약 칸을 누르면 그 타입(리그) 티어리스트로 이동 + 그 포켓몬 줄을 반짝 표시
const tlAttr=(m,x)=>` data-tm="${m}"${x.tank?' data-trole="tank"':""} data-tw="${esc(x.w)}" data-tid="${esc(x.fid||CUR_ID||"")}" data-tsh="${/그림자/.test(x.f)?1:""}" data-tg="${/거다이맥스/.test(x.f)?1:""}"`;
function goTier(m,w,id,sh,g,role){ const B=BOARDS[m]; if(!B) return;
  const k=role==="tank"?"all":m==="pvp"?(LEAGUES.find(l=>l[1]===w)||[])[0]:(TYPES.find(t=>TN[t[0]]===w)||[])[0]; if(!k) return;
  if(m==="dmax") B.st.role=role==="tank"?"tank":"deal"; B.st.sel=k; B.st.tab="all"; save(); go(m);
  setTimeout(()=>{ const root=$("#p-"+m); if(!root) return; renderBoard(m);
    const trs=[...root.querySelectorAll("tbody tr")].filter(tr=>tr.querySelector(`[data-poke="${CSS.escape(id)}"]`));
    const tr=trs.find(t=>!!t.querySelector(".tag.s")===!!sh&&(!g||t.querySelector(".tag.g")))||trs[0];
    if(tr){ tr.scrollIntoView({block:"center",behavior:"smooth"}); tr.classList.add("flash"); setTimeout(()=>tr.classList.remove("flash"),2200); } },120); }
function sumCell(label, res, m){

}
function formLine(x,m){ const where=x.f.includes(x.w)?"":` · ${esc(x.w)}`; return `<div class="form tl"${tlAttr(m,x)}>${TB(x.t)}<span><b>${esc(noPlus(x.f))}</b>${plusOf(x.f)?ptag(x.f):""}${where} <u>${x.r}위</u> (${x.p}%) <i class="tlgo">▸</i></span></div>`; }
// 기술 추천 (최종 진화형): 레이드 최고 티어 타입 기준. 가장 강한 조합을 먼저, 그게 레거시·이벤트 기술이면 아래에 "또는 일반 조합"
function skillHTML(c){
  if(!c.final){ // 진화 전: 최종 진화로 안내
    const fins=c.evo[c.evo.length-1].filter(id=>CARDS[id]);
    return `<div class="sec">추천 스킬</div><div class="sknote">스킬 추천은 <b>최종 진화 형태</b>에서만 제공해요.${fins.length?`<div class="skgo">${fins.map(id=>`<button data-n2="${esc(id)}">${esc(CARDS[id].ko)} 추천 스킬 보기 ›</button>`).join("")}</div>`:""}</div>`;
  }
  const r=c.rec; if(!r) return "";
  const old=el=>"";
  const mv=(x,el)=>`<span class="${el?"elite":""}">${esc(x)}</span>${old(el)}`;
  const combo=b=>`${mv(b.f,b.ef)} · ${mv(b.c,b.ec)}`;
  const main=r.e||r.n; if(!main) return "";
  const alt=r.e&&r.n?`<div class="alt">또는 ${combo(r.n)}</div>`:"";
  const plus=(r.plus||[]).map(x=>`<span class="plusmv"><span class="tag p">+</span>${esc(x.move)} <small>${esc(x.mega)}</small></span>`).join("");
  return `<div class="sec">추천 스킬</div>
    <div class="skill"><span class="tchip" style="--tc:${TC[r.t]}">${svg(r.t,"#fff")}${TN[r.t]}</span>
      <div class="sk-main"><div>${combo(main)}${plus?`<span class="plusbox">${plus}</span>`:""}</div>${alt}</div></div>${s2HTML(r.s2)}`;
}
// 2번째 스페셜어택 (추가 해방): 주력과 다른 타입
function s2HTML(x){
  const m=x&&(x.e||x.n); if(!m) return "";
  const one=b=>`<span class="tchip sm" style="--tc:${TC[b.t]}">${svg(b.t,"#fff")}${TN[b.t]}</span> <span class="${b.ec?"elite":""}">${esc(b.c)}</span>`;

}

// html-to-image(site/lib, MIT)를 누를 때만 불러옴. 화면 밖에 "by. PYOkemongo" 머리글 + 카드 복사본을 만들어 그림으로 바꿈
let H2I=null;
const loadH2I=()=>H2I||(H2I=new Promise((ok,no)=>{ if(window.htmlToImage) return ok(window.htmlToImage);
  const sc=document.createElement("script"); sc.src="lib/html-to-image.js"; sc.onload=()=>ok(window.htmlToImage); sc.onerror=()=>{H2I=null; no(new Error("load"));}; document.head.appendChild(sc); }));
async function saveCardImage(c,sh){
  const btn=$("#saveBtn"), card=$("#cardOut .tcard"); if(!card) return;
  btn.disabled=true; btn.textContent="이미지 만드는 중…";
  const wrap=document.createElement("div"); wrap.className="shot";
  wrap.style.width=Math.max(card.offsetWidth,340)+28+"px";
  wrap.innerHTML="";
  const clone=card.cloneNode(true); clone.querySelectorAll("img").forEach(i=>i.removeAttribute("loading"));
  wrap.appendChild(clone); wrap.insertAdjacentHTML("beforeend",`<div class="shot-by">by. PYOkemongo</div>`); document.body.appendChild(wrap);
  // 이미지로 그릴 때 글꼴 폭이 조금 달라져 진화 버튼 글자가 줄바꿈되며 테두리를 벗어나는 문제 → 버튼에 여유 폭을 줌
  clone.querySelectorAll(".evo button").forEach(b=>{ b.style.minWidth=(b.offsetWidth+8)+"px"; b.style.whiteSpace="nowrap"; b.style.textAlign="center"; });
  const skip=n=>!(n.classList&&(n.classList.contains("shbtn")||n.classList.contains("skgo")));
  try{
    const lib=await loadH2I(); try{ await document.fonts.ready; }catch(e){}
    const opt={pixelRatio:2,filter:skip,style:{position:"static",left:"0",top:"0"},cacheBust:false,backgroundColor:"#0b1416",imagePlaceholder:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="};
    let url; try{ url=await lib.toPng(wrap,opt); }catch(e){ url=await lib.toPng(wrap,{...opt,skipFonts:true}); }
    showShot(url,`PYOkemongo_${sh?"그림자_":""}${c.ko}.png`);
  }catch(e){ alertBox("이미지를 만들지 못했어요. 잠시 후 다시 눌러 주세요."); }
  finally{ wrap.remove(); btn.disabled=false; btn.textContent="📷 이미지로 저장"; }
}
function alertBox(msg){ const m=document.createElement("div"); m.className="shotmodal"; m.innerHTML=`<div class="shotbox"><p style="white-space:pre-line">${esc(msg)}</p><div class="shotbtns"><button data-x>닫기</button></div></div>`; document.body.appendChild(m); m.onclick=e=>{ if(e.target===m||e.target.closest("[data-x]")) m.remove(); }; }
// 미리보기 창: 공유(사진에 저장·카톡) / 내려받기. 공유는 버튼을 누를 때 실행해야 태블릿에서 막히지 않음
function showShot(url,name){
  const m=document.createElement("div"); m.className="shotmodal";
  m.innerHTML=`<div class="shotbox"><img src="${url}" alt="포켓몬 카드 이미지"><p class="shot-tip">이미지를 길게 눌러도 사진에 저장할 수 있어요.</p>
    <div class="shotbtns"><button data-share>공유 · 사진에 저장</button><a data-dl download="${esc(name)}" href="${url}">내려받기</a><button data-x>닫기</button></div></div>`;
  document.body.appendChild(m);
  const blob=()=>fetch(url).then(r=>r.blob()).then(b=>new File([b],name,{type:"image/png"}));
  const sb=m.querySelector("[data-share]");
  sb.onclick=async()=>{ try{ const f=await blob(); if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:name}); else m.querySelector("[data-dl]").click(); }catch(e){} };
  m.onclick=e=>{ if(e.target===m||e.target.closest("[data-x]")) m.remove(); };
}
// 100% (15/15/15) CP
const CPM={15:0.51739395,20:0.59740001,25:0.667934,30:0.7317,35:0.76156384,40:0.79030001,50:0.84029999,51:0.84529999};
const cpOf=(st,lv)=>Math.max(10,Math.floor((st[0]+15)*Math.sqrt(st[1]+15)*Math.sqrt(st[2]+15)*CPM[lv]**2/10));
function openCard(id, keepShadow){
  const c=CARDS[id]; if(!c) return;
  if(!keepShadow) SHADOW=false; CUR_ID=id;
  const sh=SHADOW&&hasShadow(c);
  suggest("");
  const color=sh?"#7b3fb0":(TC[c.types[0]]||"#6fb39a");
  const R=Object.fromEntries(MODES.map(([m])=>[m,tiersFor(c,m,sh)]));
  const evo=c.evo.map((stage,i)=>(i?'<span class="arw">›</span>':"")+`<div class="stage">${stage.map(s=>`<button class="${s===id?"cur":""}" data-n2="${esc(s)}">${esc(CARDS[s]?.ko||s)}</button>`).join("")}${stage.length>1?'<span class="branch">분기 진화</span>':""}</div>`).join("");
  const detail=(label,res,m)=>`<div class="drow"><div class="k">${label}</div><div class="forms">${res.via?`<div class="via">최종 진화 ${esc(res.via.join(" · "))} 기준</div>`:""}${res.list.length?res.list.map(x=>formLine(x,m)).join(""):`<div class="form">${TB(null)}<span>순위권 밖</span></div>`}</div></div>`;
  const s=c.stats;
  const tree=c.evo.flat(), how=tree.flatMap(t=>(CARDS[t]?.how||[]).filter(h=>tree.includes(h.from)).map(h=>({...h,to:t})));
  const howHTML=how.length?`<div class="how">${how.map(h=>`<div><b>${esc(CARDS[h.from]?.ko||h.from)} → ${esc(CARDS[h.to].ko)}</b>${h.c?` · <span class="cdy">사탕 ${h.c}</span>`:""}${h.x.length?" · "+h.x.map(esc).join(" · "):""}</div>`).join("")}</div>`:"";
  const CPL=[["리서치",15],["레이드·알",20],["날씨 부스트",25],["최대",40],["최대",50]];
  const cpHTML=`<div class="cpgrid">${CPL.map(([l,lv])=>`<div class="cpc"><div class="l">${l}</div><div class="v">${cpOf(s,lv)}</div><div class="lv">Lv${lv}</div></div>`).join("")}</div>`;
  $("#cardOut").innerHTML=`
  <article class="tcard${sh?" shadow":""}" style="--c:${color}"><div class="tcard-in">
    <div class="ctop">
      <div class="pic">${svg(c.types[0]).replace("<svg",'<svg class="ph"')}<div class="no">No.${String(c.dex).padStart(4,"0")}</div>
        <img src="${ART(c.dex)}" alt="" loading="lazy" onerror="this.remove()"></div>
      <div>
        <div class="cname">${sh?"그림자 ":""}${esc(c.ko)}<small>#${c.dex}</small>${hasShadow(c)?`<button class="shbtn${sh?" on":""}" id="shBtn">${sh?"그림자 ON":"그림자"}</button>`:""}</div>
        <div class="ctype">${c.types.map(t=>`<span class="tchip" style="--tc:${TC[t]}">${svg(t,"#fff")}${TN[t]}</span>`).join("")}</div>
        <div class="sum">${MODES.map(([m,l])=>sumCell(l,R[m],m)).join("")}</div>
      </div>
    </div>
    <div class="cbody">
      <div class="sec">EVOLUTION</div>
      <div class="evo">${evo}</div>${howHTML}
      <div class="sec">100% CP</div>
      ${cpHTML}
      <div class="sec">TIER DETAIL</div>
      ${MODES.map(([m,l])=>detail(l,R[m],m)).join("")}
      ${skillHTML(c)}
    </div>
    <div class="cfoot"><span>공 ${s[0]} · 방 ${s[1]} · 체 ${s[2]}</span><span>${esc(c.en)}</span></div>
  </div></article>
  <div class="note">갱신 <b>${esc(DEX.updated)}</b> · 출처: ${esc(DEX.sources)}</div>`;
  $("#cardOut").querySelectorAll("[data-n2]").forEach(b=>b.onclick=()=>openCard(b.dataset.n2,true));
  $("#saveBtn").onclick=()=>saveCardImage(c,sh);
  const sb=$("#shBtn"); if(sb) sb.onclick=()=>{ SHADOW=!SHADOW; openCard(id,true); };
  if(hv()==="card"&&location.hash!=="#p="+id){ try{ history.replaceState(null,"","#p="+id); }catch(e){} }
  $("#cardOut").querySelectorAll("[data-tm]").forEach(el=>el.onclick=()=>goTier(el.dataset.tm,el.dataset.tw,el.dataset.tid,el.dataset.tsh,el.dataset.tg,el.dataset.trole));

// ===== 티어 보드 =====
const typeSels=avail=>TYPES.map(([k,n,c])=>({k,n,c,icon:svg(k),off:avail&&!avail(k)}));
const ALL_SEL={k:"all",n:"전체 티어리스트",c:"#8ef0b0",icon:'<span class="allico">★</span>',wide:1};
const NOTE_RAID=`티어는 <b>ER 순위</b>로 정해요. 티어마다 개수 상한과 최소 조건(1위 대비 ER %)이 있고, 바로 앞과 ER 1% 이내면 같은 티어예요. 최종 진화형만 표시해요. TDO는 탱커 순위용 정렬 기준이에요. 기술명 뒤 <b>*</b>는 레거시·특수 기술이에요.<br>
 <b>DPS</b> = (노말딜×스킬코스트 + 스킬딜×노말에너지) ÷ (스킬코스트×노말시간 + 노말에너지×스킬시간)<br>
 <b>한 방 데미지</b> = ⌊0.5 × 위력 × 공격/방어 × 자속 1.2 × 효과굉장 1.6⌋ + 1<br>
 <b>TDO</b> = DPS × 버티는 시간(체력 × 방어 ÷ 900) · <b>ER</b> = (DPS³ × TDO)<sup>¼</sup><br>
 가정: Lv40 · 개체값 15/15/15 · 기준 상대 포켓몬 방어 180 · 날씨 없음 · 그림자는 주는 피해·받는 피해 ×1.2 · 각 포켓몬은 해당 타입 최고 기술 조합 기준`;
const NOTE_DMAX=`맥스기 타입은 <b>노말기 타입</b>을 따라가요. 티어는 <b>점수 순위</b>로 정하고, 레이드와 같은 개수 상한·최소 조건을 써요. 최종 진화형만 표시해요.<br>
 <b>맥스딜</b> = 맥스기 한 방 데미지 (위력: 다이맥스 Lv3 350 · 거다이맥스 Lv3 450)<br>
 <b>게이지</b> = 노말기 DPS (맥스 게이지를 채우는 속도의 대용 지표)<br>
 <b>내구</b> = 체력 × 방어 ÷ 100 (탱커 순위용, 티어 없음)<br>
 <b>점수</b> = (맥스딜³ × 게이지)<sup>¼</sup> — 레이드 ER과 같은 3:1 비율<br>
 가정: Lv40 · 개체값 15/15/15 · 효과굉장 · 서포트(맥스스피릿) 역할은 반영하지 않아요. 출시된 다이맥스·거다이맥스 목록 기준이에요.`;
const NOTE_PVP=`티어는 리그별 <b>순위 개수 상한</b>으로만 정해요 (PvPoke 점수는 상위권이 촘촘해서 % 조건을 쓰지 않아요).<br>
 <b>점수</b> = PvPoke 종합 점수 (모든 상대·실드 상황 대전 시뮬레이션 결과) · <b>스탯곱</b> = 공격×방어×체력 ÷ 1000 (내구 지표) · <b>레이팅</b> = PvPoke 대전 레이팅<br>
 기술은 PvPoke 추천 조합이에요. 리그별 상위 40위까지 표시해요.`;
// 다이맥스 역할 스위치 (큰 설정값: 탱커=파랑 방패, 딜러=주황 칼)

// 다이맥스 탱커: 다이맥스 가능 포켓몬(최종진화) 한 줄씩, 내구 = 체력×방어/100, 게이지 = 가장 빠른 노말기 DPS
let TANK_POOL=null;
function dmaxTankPool(){
  if(TANK_POOL) return TANK_POOL;

function parseCSV(t){ const rows=[]; let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(f);f="";} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; } else f+=ch; }

// 무작위 첫 비밀번호를 한 번만 보여 주고 복사 (친구에게 보낼 안내 문장째 복사)
// 초대 코드 = PYO-<트레이너 코드 12자리>-<무작위 첫 비밀번호>. 링크(#invite=…)를 누르거나 로그인 화면에 붙여넣으면 바로 로그인 → 비밀번호 정하기
const INVITE_RE=/PYO-(\d{12})-([a-z0-9]{4}-[a-z0-9]{4})/i;
async function useInvite(text){ const m=String(text||"").match(INVITE_RE); if(!m) return false;
  setMe(await api("login",{method:"POST",body:JSON.stringify({code:m[1],password:m[2].toLowerCase()})})); await syncDown(); if(location.hash!=="#me") go("me"); else renderMe(); return true; }
function pwBox(title,code,temp){

  const msg=`PYOkemongo 초대장이에요!\n아래 링크를 누르면 바로 로그인돼요. 비밀번호만 정하면 끝!\n${link}\n\n링크가 안 열리면 사이트(pogo.hhhpyo.cloud) 로그인 화면에 이 초대 코드를 붙여넣으세요:\n${inv}`;
  const m=document.createElement("div"); m.className="shotmodal";
  m.innerHTML=`<div class="shotbox"><p>${esc(title)}</p><div class="tmppw" style="font-size:19px;letter-spacing:1px;word-break:break-all">${esc(inv)}</div><p class="sknote">이 화면을 닫으면 다시 볼 수 없어요. 복사해서 친구에게 보내 주세요. 친구는 링크를 누르거나 초대 코드를 붙여넣으면 바로 시작해요.</p>

  document.body.appendChild(m);

  m.onclick=e=>{ const b=e.target.closest("[data-cp]"); if(b) return copy(b.dataset.cp==="inv"?inv:msg,b); if(e.target.closest("[data-x]")) m.remove(); };

function rkId(n){ const m=String(n).match(/^(Alolan|Galarian|Hisuian|Paldean) (.+)$/);
  let b=(m?m[2]:String(n)).toLowerCase().replace(/[^a-z0-9 ]/g,"").trim().replace(/ +/g,"_"); if(m) b+="_"+m[1].toLowerCase();

// 턴당 딜 = 노말기 위력×자속×상성 + (턴당 에너지 ÷ 스페셜어택 에너지)×위력×자속×상성 중 가장 좋은 조합. 그림자는 공격 ×1.2 · 방어 ×5/6
function rkVal(m,o){ const c=CARDS[m.id], pv=c&&c.pv; if(!pv) return null; const r=ratio(m);

// 상대 3칸에 한 마리씩 맡기는 3마리: 칸마다(나올 수 있는 포켓몬 평균) 값을 구해, 후보 12마리 중 합이 가장 큰 배치를 고름
function rkMine(slots){
  const opp=slots.map(sl=>sl.map(p=>CARDS[rkId(p[0])]).filter(Boolean));
  const cand=[];
  BOX.rows.forEach((m,ix)=>{ if(!CARDS[m.id]||!CARDS[m.id].pv) return;
    const sv=opp.map(os=>{ if(!os.length) return null; let s=0, best=null; for(const o of os){ const x=rkVal(m,o); s+=Math.log(x.v); if(!best||x.v>best.v) best=x; } return {l:s/os.length, ft:best.ft, ct:best.ct}; });
    cand.push({m,ix,sv,tot:sv.reduce((a,x)=>a+(x?x.l:0),0)}); });

  const pool=new Set(top.slice(0,8)); opp.forEach((os,i)=>{ if(os.length) [...top].sort((a,b)=>b.sv[i].l-a.sv[i].l).slice(0,4).forEach(x=>pool.add(x)); });

function evKind(cat,t){
  t=String(t||"");
  if(/스포트라이트/.test(t)) return "spot";
  if(/레이드 ?아워/.test(t)) return "hour";
  if(/맥스 ?먼데이/.test(t)) return "maxmon";
  if(/커뮤니티 ?데이 ?클래식/.test(t)) return "cdc";
  if(/커뮤니티 ?데이/.test(t)||cat==="cday") return "cday";
  if(/레이드 ?데이/.test(t)) return "raidday";
  if(/로켓단/.test(t)) return "rocket";
  if(/GO ?페스트|GO ?투어|와일드 ?에어리어|GO ?Fest|GO ?Tour|Wild Area/i.test(t)) return "big";
  if(cat==="pass") return "pass";
  if(cat==="max") return "maxday";
  if(cat==="shadow") return "shadow";
  if(cat==="mega") return "mega";
  if(cat==="raid") return "raid5";
  if(cat==="hour") return "hour";
  if(cat==="spot") return "spot";
  return null;
}

      <div class="gitems">${it("Item_1201","노말 기술머신","노말기 무작위")}${it("Item_1202","스페셜 기술머신","스페셜어택 무작위")}${it("Item_1203","대단한 노말 기술머신","골라서 변경")}${it("Item_1204","대단한 스페셜 기술머신","골라서 변경")}</div></div>`)}
  ${sec(5,"상성 — 약점을 찌르면 1.6배",[
    "상대의 <b>약점 타입 기술</b>로 때리면 1.6배, 반감이면 0.63배예요.",
    "상대 타입이 두 개인데 <b>둘 다 약점</b>이면 <b>이중약점</b> 2.56배, <b>둘 다 반감</b>이면 <b>이중반감</b> 0.39배예요. (풀 기술 → 물·땅 타입 = 이중약점)",
    "포켓몬과 같은 타입의 기술을 쓰면 1.2배 더 세요. (전기 포켓몬 + 전기 기술)"],
    `<div class="gfig"><div class="gchart"><div>${chip("water")} <span>▶</span> ${chip("fire")} <b class="up">×1.6</b></div><div>${chip("fire")} <span>▶</span> ${chip("water")} <b class="dn">×0.63</b></div><div>${chip("grass")} <span>▶</span> ${chip("water")}${chip("ground")} <b class="up">×2.56</b></div><div>${chip("grass")} <span>▶</span> ${chip("fire")}${chip("flying")} <b class="dn">×0.39</b></div></div></div>`,
    go("type","상성표 보기"))}
  ${sec(6,"레이드",[
    "체육관에 나오는 강한 포켓몬을 여럿이 같이 잡아요. <b>1성 · 3성 · 5성 · 메가</b>가 있어요.",
    "상대 <b>약점 타입</b>의 딜러 6마리를 데려가요. 누구를 키울지는 티어리스트에서 볼 수 있어요.",
    "5성은 전설 포켓몬이에요. 보통 3~5명이 함께 해야 해요."],
    `<div class="gfig"><div class="gstars"><span>★<em>1성 · 혼자</em></span><span>★★★<em>3성 · 1~2명</em></span><span class="five">★★★★★<em>5성 · 3~5명</em></span></div></div>`,
    go("raid","레이드 티어")+go("type","상대 공략"))}
  ${sec(7,"다이맥스 (맥스배틀)",[
    "<b>파워스폿</b>에서 하는 전투예요. 걸어서 모으는 <b>맥스파티클</b>이 필요해요.",
    "노말기로 게이지를 모아 <b>맥스기</b>를 3번 써요. 맥스기 타입은 노말기 타입을 따라가요.",
    "세게 때리는 <b>딜러</b>와 오래 버티는 <b>탱커</b>를 나눠서 키워요."],"",
    go("dmax","다이맥스 티어"))}
  ${sec(8,"GO 로켓단",[
    "검게 변한 포켓스톱이나 풍선에서 만나요. <b>하는 말</b>을 보면 어떤 타입을 쓰는지 알 수 있어요.",
    "이기면 <b>그림자 포켓몬</b>을 잡을 수 있어요."],"",
    go("rocket","로켓단 공략"))}
  ${sec(9,"표켓몬고 잘 활용하는법",[
    "맨 위 <b>검색창</b>에 이름을 넣으면 그 포켓몬의 티어 · 추천 스킬 · 100% CP가 나와요.",
    "<b>티어</b>에서 누가 강한지 봐요. S+가 가장 높고 C-가 가장 낮아요.",
    "티어는 타입과 상관없이 <b>그 포켓몬이 얼마나 강한지</b>예요. 타입을 고르면 그 타입 안에서의 순위를 볼 수 있어요."],"",
    go("tier","티어리스트"))}
  <div class="note">아이템 그림: PokeMiners · 포켓몬 그림: PokeAPI</div>`;
}

// ===== 업데이트 (게임 데이터 변경 기록, data/changes.json — 빌드 스크립트가 매일 비교해서 씀) =====
let CHG=null, UPD_ALL=false, UPD_TIER={};
const UPD_KIND=[["mon","새 포켓몬",/^새 포켓몬: /],["move","새 기술",/^새 기술: /],["plus","메가 플러스 기술",null],["ready","레이드 수치 생김",null],["learn","배우는 기술 변화",null],["num","기술 수치 변경",/^기술 수치 변경: /],["tier","티어 변동",null],["start","",null]];
function renderUpdates(){
  const root=$("#v-updates"); if(!root) return;
  if(!CHG){ root.innerHTML='<div class="empty">불러오는 중…</div>'; return; }
  const li=i=>`<li>${i.id&&CARDS[i.id]?`<a data-poke="${esc(i.id)}">${esc(i.txt.replace(UPD_KIND.find(k=>k[0]===i.k)?.[2]||/^$/,""))}</a>`:esc(i.txt.replace(UPD_KIND.find(k=>k[0]===i.k)?.[2]||/^$/,""))}</li>`;
  const day=e=>`<div class="gcard upd"><h3>${esc(e.d)}</h3>${UPD_KIND.map(([k,lab])=>{ const its=e.items.filter(i=>i.k===k); if(!its.length) return "";
      const many=k==="tier"&&its.length>5&&!UPD_TIER[e.d], shown=many?its.slice(0,5):its;
      return `${lab?`<div class="updk">${lab}${its.length>1?` <span>${its.length}</span>`:""}</div>`:""}<ul>${shown.map(li).join("")}</ul>${many?`<button class="evmore" data-updt="${esc(e.d)}">티어 변동 ${its.length-5}개 더 보기</button>`:""}`; }).join("")}</div>`;
  const log=CHG.log||[], shown=UPD_ALL?log:log.slice(0,10);
  root.innerHTML=`<p class="intro-top">게임 데이터에서 <b>바뀐 점</b>을 모아 보여 줘요. 매일 새벽 자동으로 확인해요.${CHG.checked?` <span class="updchk">마지막 확인 ${esc(CHG.checked)}</span>`:""}</p>
  ${CHG.waiting?.length?`<div class="gcard upd wait"><h3>레이드 수치 기다리는 기술</h3><ul>${CHG.waiting.map(w=>`<li>${esc(w.n)} · ${esc(w.m)}</li>`).join("")}</ul><div class="updnote">게임에 기술은 나왔지만 레이드 수치가 아직 공개되지 않았어요. 수치가 나오면 자동으로 티어에 들어가요.</div></div>`:""}
  ${log.length?shown.map(day).join(""):'<div class="empty">아직 바뀐 점이 없어요.</div>'}
  ${log.length>10?`<button class="evmore" id="updAll">${UPD_ALL?"접기":`지난 기록 모두 보기 (${log.length})`}</button>`:""}
  <div class="note">출처: PvPoke · PokeMiners game master</div>`;
  root.querySelectorAll("[data-updt]").forEach(b=>b.onclick=()=>{ UPD_TIER[b.dataset.updt]=1; renderUpdates(); });
  const a=$("#updAll"); if(a) a.onclick=()=>{ UPD_ALL=!UPD_ALL; renderUpdates(); };
}

// ===== 더보기 (아래 탭 → 위로 펼치는 메뉴, v3.3) =====
// 더보기 안의 화면(일정·가이드·회원 기능 소개)은 하위 탭 없이 각각 따로 된 페이지.
const daysOld=d=>{ const t=Date.parse(d); return isNaN(t)?0:Math.floor((Date.now()-t)/864e5); };
function closeMore(){ const m=$("#moremenu"); if(m){ m.hidden=true; m.innerHTML=""; } $("#tabbar")?.classList.remove("mopen"); }
function toggleMore(){
  const m=$("#moremenu"); if(!m) return; if(!m.hidden){ closeMore(); return; }
  const v=hv(), row=(k,t,d)=>`<button class="mmrow${v===k?" on":""}" data-go="${k}"><b>${t}</b><span>${d}</span></button>`;
  const stale=[]; if(DEX&&daysOld(CHG?.checked||DEX.updated)>10) stale.push("도감 · 티어"); if(EVENTS&&FEED_UPDATED&&daysOld(FEED_UPDATED)>3) stale.push("일정");
  m.innerHTML=`${stale.length?`<div class="stale">${stale.join(" · ")} 정보가 오래됐을 수 있어요.</div>`:""}<div class="mmbox">
    ${row("home","일정","지금 잡을 포켓몬 · 진행 중인 이벤트")}
    ${row("guide","왕초보 가이드","처음 시작했다면 이것만")}
    ${row("intro","회원 기능 소개","내 포켓몬 기준 추천 기능")}
    ${row("updates","업데이트","새 기술 · 바뀐 기술 · 티어 변동")}
    <a class="mmrow" href="mailto:hhhpyoxx@gmail.com?subject=${encodeURIComponent("PYOkemongo 의견")}"><b>의견 보내기</b><span>고쳤으면 하는 점이나 틀린 정보를 알려 주세요</span></a>
    <div class="fan">PYOkemongo는 개인이 만든 비공식 팬 사이트예요. 포켓몬 · Pokémon GO의 이름과 그림에 대한 권리는 각 권리자에게 있어요.</div></div>`;
  m.hidden=false; $("#tabbar").classList.add("mopen");
}
// ===== 시작 =====
renderHome(); show();
["raid","dmax","pvp"].forEach(renderBoard); renderType();
$("#cardOut").innerHTML='<div class="empty">도감 데이터를 불러오는 중이에요…</div>';
fetch("data/pokedex.json").then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
  DEX=d; TANK_POOL=null; if(d.tierRule) TIER_RULE=d.tierRule;
  for(const c of d.cards){ CARDS[c.id]=c; SEARCH.push({id:c.id,ko:c.ko,en:c.en}); if(!NAME2ID[c.ko]) NAME2ID[c.ko]=c.id; const k2=c.ko.replace(/\s/g,""); if(!NAME2ID[k2]) NAME2ID[k2]=c.id; const k3=c.ko.replace(/\(.+\)$/,""); if(k3!==c.ko&&!NAME2ID[k3]) NAME2ID[k3]=c.id; }
  suggest(""); { let pid=(location.hash.match(/^#p=(.+)$/)||[])[1]; try{ pid=pid&&decodeURIComponent(pid); }catch(e){} openCard(pid&&CARDS[pid]?pid:CARDS.pikachu?"pikachu":d.cards[0].id); }
  ["raid","dmax","pvp"].forEach(id=>{ $("#p-"+id).dataset.ready=""; renderBoard(id); });
  if(location.hash.slice(1)==="dex") renderDex();
  if(location.hash.slice(1).startsWith("box")) renderBox(location.hash.slice(1));
  if(location.hash.slice(1)==="intro") renderIntro();
  if(hv()==="rocket") renderRocket();
  renderType();
  renderHome();
}).catch(err=>{
  const msg=`<div class="empty">도감 데이터를 불러오지 못했어요. (${esc(err.message)})<br>잠시 후 새로고침해 주세요.</div>`;
  $("#cardOut").innerHTML=msg; ["p-raid","p-dmax","p-pvp","v-type"].forEach(id=>$("#"+id).innerHTML=msg);
});
fetch("data/events.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
  if(d&&Array.isArray(d.events)&&d.events.length){ EVENTS=d.events; FEED_UPDATED=d.updated||FEED_UPDATED; FEED_SOURCE=d.source||FEED_SOURCE; }
  else EVENTS=FALLBACK_EVENTS;
  renderHome();
}).catch(()=>{ EVENTS=FALLBACK_EVENTS; renderHome(); });
fetch("data/rocket.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{ ROCKET=j&&Array.isArray(j.list)?j:false; if(hv()==="rocket") renderRocket(); }).catch(()=>{ ROCKET=false; if(hv()==="rocket") renderRocket(); });
fetch("data/changes.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{ CHG=j; if(hv()==="updates") renderUpdates(); }).catch(()=>{ CHG={log:[]}; if(hv()==="updates") renderUpdates(); });
fetch("data/picks.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{ PICKS=j; renderHome(); }).catch(()=>{});
</script>
